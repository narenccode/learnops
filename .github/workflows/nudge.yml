name: nudge

# Weekdays 09:30 India time: remind whoever a stuck pull request is waiting for. No AI, no secrets.
on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  nudge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nudge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/nudge.py
