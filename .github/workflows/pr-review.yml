name: pr-review

# Rule checks on every pull request: one verdict comment and one label. Not a required check, so
# a failure here never blocks a merge. It never approves, merges or closes anything.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    # Draft PRs are skipped; PRs from forks and from Dependabot get a read-only token.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rule checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr_rules.py --event "$GITHUB_EVENT_PATH" --post
