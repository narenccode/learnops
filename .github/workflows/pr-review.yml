name: pr-review

# Advice on every pull request: rule checks and an AI read, posted as ONE comment that is updated in place.
# It never sets a label or a status and never blocks a merge. CI (`checks`) and one approval are the gate.
# Manual run: Actions -> pr-review -> Run workflow -> PR number.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review again"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Draft PRs are skipped; PRs from forks and from Dependabot get a read-only token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The bot's own scripts always come from the default branch (latest, trusted), never from the PR's
      # merge checkout: a PR stacked on an older branch would otherwise be judged by old bot code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: bot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Review
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # manual run: the scripts come from the default branch (latest, trusted); only the PR's changes are fetched
            git fetch origin "refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
            python .github/scripts/pr_review.py --pr "$PR_NUMBER" --head refs/remotes/pr/head
          else
            python bot/.github/scripts/pr_review.py --event "$GITHUB_EVENT_PATH"
          fi
