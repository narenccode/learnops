# Valid B1 example for contracts/h5p-practice.v1.md (PRD B7) and the B1 `file` field.
# Fictional content for contract testing only. It is not the B8.2 sample course.
#
# Layout: this file is a second top-level example in the B1 example folder, so the shared
# example validator checks it against the B1 schema. Its body files are in the subfolder
# `h5p-practice/` (supporting files, not validated as examples); body and file paths are
# relative to this folder. The plain B1 example (course.yaml, weeks/) is a different package.
# To run the package validator on it, copy this file to `course.yaml` beside `h5p-practice/`.
#
# The week keeps its one guide Page and one task Assignment. The H5P practice item is an
# optional extra. This ordinary practice item comes right after the guide Page (list order; there
# is no ordering field), and it is never graded. Where a video checkpoint goes is decided (B7
# section 4, decision 9); this example has no video lesson, so it does not show it.
#
# The .h5p file named below is NOT in the repository, on purpose: no real .h5p file is kept
# here (B7). The file name is illustrative; B7 does not fix a folder or a naming convention.
schema: learnops.course/v1
course:
  shortname: DEMO-H5P-101
  fullname: "Practice with H5P"
  slug: practice-with-h5p
  total_points: 100
  mode: full
sections:
  - number: 1
    title: "Week 1 — Set up your tools"
    idnumber: wk-01
    unlock:
      after: null
      start_date: null
    activities:
      - type: page
        idnumber: wk-01-guide
        title: "Week 1 guide"
        body: h5p-practice/weeks/01-guide.md
      - type: h5p
        idnumber: wk-01-practice
        title: "Week 1 practice"
        graded: false
        file: h5p-practice/wk-01-practice.h5p
      - type: assignment
        idnumber: wk-01-task
        title: "Week 1 task"
        body: h5p-practice/weeks/01-task.md
        points: 100
        submission: [onlinetext, file]
        completion: submit
