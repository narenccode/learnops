# B8.3 expected findings (PRD B8.3, C2.3, C2.7). One entry per planted error.
# Source of the mapping: docs/design/checker.md section 11.3 (Proposal, #148). Not yet confirmed by the guide.
# These entries say what a future checker SHOULD report. No checker exists yet, so nothing here
# proves detection. Each variant changes one thing from its applicable baseline: B8.2 for all variants except CK-07 and the proposed CK-08 case, which use the merged course with the B8.1 template. B8.2 itself is never changed.
#
# Fields
#   id              unique variant id (package variants: also the folder name)
#   rule            CK rule from PRD C2.3 (CK-01..CK-13)
#   input_kind      package (folder `<id>/package/`) or mbz (Moodle backup, built in a lab)
#   status          built (files exist in this folder) | planned (package variant, added in a later PR of
#                   the B8.3 series) | pending-lab (needs a Moodle lab session; no file yet)
#   path            package variants: the changed file, relative to the package folder
#   element         the course element carrying the error, by idnumber
#   planted_change  the one change made to the applicable baseline
#   expected        the finding a checker must report: rule, element, severity
#   reason          why it must be reported
#   also_expected   other rules that fire as their own, separate finding on the same variant, or [].
#                   CK-01 is never listed here for an item explained by CK-04, CK-05 or CK-13 (guide, item 13)
#   notes           open points
#   assertable      optional; false = the expected finding is provisional and must not be asserted by a checker test yet

version: 1
# PROPOSED, not confirmed. This mapping is the proposal in docs/design/checker.md section 11.3, as
# merged in commit 4111e0c (#148). It is NOT an approved expected-results baseline and must not be
# used as the oracle for the 100 % target (PRD C2.7). Per the checker design's author (Akshita), it
# stays `proposed` until the guide has answered the items below and the design owner (Shraddha)
# confirms it. Then set mapping_status to confirmed and fill in `confirmation`.
#   Confirmed by Akshita for the proposal: the rule-to-variant pairing matches the design as merged
#   in #148, and the package variants (CK-02, 03, 09, 12) can be built without the lab.
#   Answered by the guide on 2026-11-23 (https://github.com/narenccode/learnops/issues/112#issuecomment-7095842207):
#     item 12  severity: all thirteen rules are error
#     item 13  report the root cause once: an item unreachable because of CK-04, CK-05 or CK-13 is still
#              listed as unreachable with its cause, but is NOT a separate CK-01 finding; the report
#              line says "explained by CK-0x". CK-01 still fires when no other rule explains the item
#     item 17  confirmed: a package failing B1 stops with the B1 errors, every CK rule is not checked
#     item 22  B8.3 .mbz variants use Moodle 5.3 only; decision 0017 later made Moodle 5.3 the
#              only supported version throughout LearnOps
#   Still open: Shraddha, as design owner, confirms the mapping after pending guide decisions;
#   nine CK rule categories require `.mbz` inputs, represented by ten variants because CK-06 has
#   two independent cases; all ten variants need the lab.
mapping_status: proposed
mapping_source: "docs/design/checker.md section 11.3 at commit 4111e0c"
confirmation: null   # {by: [...], reference: <issue/PR/decision link>, date: <YYYY-MM-DD>}
baseline: testdata/b8-2-sample-course   # must report zero findings
variants:

  - id: ck-01-unreachable-by-past-date
    rule: CK-01
    input_kind: mbz
    status: pending-lab
    path: null
    element: wk-03-guide
    planted_change: "Week 3 guide Page availability: opens only before 1 January 2020 (restricted access, date condition)"
    expected: {rule: CK-01, element: wk-03-guide, severity: error}
    reason: "The date condition is already in the past, so no learner can ever open the Page."
    also_expected: []
    notes: "No other rule explains this item, so CK-01 is reported as its own finding (guide, item 13). A package can only express unlock.start_date, which opens a section and never closes it, so this needs an .mbz."

  - id: ck-02-completion-never-met
    rule: CK-02
    input_kind: package
    status: built
    path: course.yaml
    element: wk-01-guide
    planted_change: "wk-01-guide (a Page) gets `completion: submit`"
    expected: {rule: CK-02, element: wk-01-guide, severity: error}
    reason: "A Page has nothing to submit, so the completion rule can never be met."
    also_expected: []
    notes: "Nothing unlocks from the Page (week 2 waits for wk-01-task), so CK-13 and CK-01 do not interact."

  - id: ck-03-points-total-mismatch
    rule: CK-03
    input_kind: package
    status: built
    path: course.yaml
    element: course.total_points
    planted_change: "course.total_points changed from 100 to 120; the four tasks still add up to 100"
    expected: {rule: CK-03, element: course.total_points, severity: error}
    reason: "Graded points (100) differ from the declared target (120)."
    also_expected: []
    notes: "The target is changed, not a task's points, so CK-09 does not fire."

  - id: ck-04-unlock-missing-activity
    rule: CK-04
    input_kind: mbz
    status: pending-lab
    path: null
    element: wk-03
    planted_change: "Week 3 availability names an activity (cm) that was removed from the course"
    expected: {rule: CK-04, element: wk-03, severity: error}
    reason: "The unlock rule refers to an activity that does not exist."
    also_expected: []
    notes: "Week 3 is still listed as unreachable, with its cause, but is not a separate CK-01 finding: the report line says explained by CK-04 (guide, item 13). In a package the B1 validator rejects an unknown unlock.after."

  - id: ck-05-circular-unlock
    rule: CK-05
    input_kind: mbz
    status: pending-lab
    path: null
    element: "wk-02, wk-03"
    planted_change: "Change only Week 2 section to wait for wk-03-task instead of wk-01-task; Week 3 already waits for wk-02-task in the B8.2 baseline"
    expected: {rule: CK-05, element: "wk-02, wk-03", severity: error}
    reason: "Each section waits for the other, so neither can ever open."
    also_expected: []
    notes: "Weeks 2 and 3 are still listed as unreachable, with their cause, but are not separate CK-01 findings: the report lines say explained by CK-05 (guide, item 13). A package rejects a later reference (decision 0003 #23)."

  - id: ck-06-duplicate-idnumber
    rule: CK-06
    input_kind: mbz
    status: pending-lab
    path: null
    element: wk-01-task
    planted_change: "Two activities carry the ID number wk-01-task"
    expected: {rule: CK-06, element: wk-01-task, severity: error}
    reason: "idnumbers identify activities and must be unique."
    also_expected: []
    notes: "The package variant duplicate-id (#118) is a B1 error (duplicate_idnumber), not CK-06."

  - id: ck-06-invalid-idnumber
    rule: CK-06
    input_kind: mbz
    status: pending-lab
    path: null
    element: "Week 1 Task"
    planted_change: "One activity has the ID number `Week 1 Task` (spaces and capitals)"
    expected: {rule: CK-06, element: "Week 1 Task", severity: error}
    reason: "The idnumber is not in the valid form."
    also_expected: []
    notes: "Separate variant from the duplicate so each has one change."

  - id: ck-07-protected-item-changed
    rule: CK-07
    input_kind: mbz
    status: pending-lab
    path: null
    element: final-project
    planted_change: "After merging into the B8.1 template, the Final project max grade is 80 instead of 100"
    expected: {rule: CK-07, element: final-project, severity: error}
    reason: "A protected item must stay as in the reference model (B8.1)."
    also_expected: []
    notes: "Needs --reference-model (the B8.1 model). A package using `final-project` is a B1 error, not CK-07."

  - id: ck-08-completion-criteria-missing-item
    rule: CK-08
    input_kind: mbz
    status: pending-lab
    path: null
    element: course-completion-criteria
    assertable: false   # scripted edit approved in principle (issue #232, point 4); fixture not created, CK-07 check pending
    planted_change: "Scripted, repeatable edit (approved in principle by the guide, issue #232 point 4): after merging with the B8.1 template, edit the `.mbz` completion-criterion XML so one criterion uses a `cmid` absent from the merged course model; `idnumber` remains absent and no activity is deleted. This is a backup-edit exception, not a Moodle setting."
    expected: {rule: CK-08, element: course-completion-criteria, severity: error}
    reason: "The criteria refer to a cmid that does not identify any activity in the merged course model."
    also_expected: []
    notes: "Approved in principle by the guide (issue #232, comment 7176861868, point 4): a scripted, repeatable edit kept in testdata with its SHA-256 before and after and labelled synthetic, once the editor has checked that the changed criterion does not also fire CK-07. The fixture has not been created or verified. Baseline is the merged course with the B8.1 template, as for CK-07. A normal Moodle setting does not create a dangling cmid; this case would require editing the completion-criterion XML inside the `.mbz` after backup. Do not rely on this variant until the scripted edit exists and the CK-07 check is done. Use a cmid absent from every activity in the merged model, omit idnumber, and delete no activity, so CK-07 is not triggered."

  - id: ck-09-marking-table-sum
    rule: CK-09
    input_kind: package
    status: built
    path: weeks/02-task.md
    element: wk-02-task
    planted_change: "Marking table row 'Document answers' changed from 10 to 5, so rows add up to 20; the task is worth 25"
    expected: {rule: CK-09, element: wk-02-task, severity: error}
    reason: "Marking-table points (20) differ from the assignment points (25)."
    also_expected: []
    notes: "The B1 validator lists the marking table as not checked, so only CK-09 fires."

  - id: ck-10-no-marking-workflow
    rule: CK-10
    input_kind: mbz
    status: pending-lab
    path: null
    element: wk-01-task
    planted_change: "Week 1 task assignment: marking workflow turned off"
    expected: {rule: CK-10, element: wk-01-task, severity: error}
    reason: "Assignments must use a marking workflow so grades are not released automatically."
    also_expected: []
    notes: ""

  - id: ck-11-graded-practice-h5p
    rule: CK-11
    input_kind: mbz
    status: pending-lab
    path: null
    element: "practice item in week 1"
    planted_change: "A week 1 practice H5P activity with a grade of 10"
    expected: {rule: CK-11, element: "practice item in week 1", severity: error}
    reason: "Practice activities must not carry a grade item."
    also_expected: []
    notes: "In a package, graded: true on an h5p item is a B1 schema error, not CK-11."

  - id: ck-12-full-url-media
    rule: CK-12
    input_kind: package
    status: built
    path: weeks/01-guide.md
    element: wk-01-guide
    planted_change: "Guide body gets an image at https://example.invalid/diagram.png (example.invalid never resolves)"
    expected: {rule: CK-12, element: wk-01-guide, severity: error}
    reason: "Media must be a relative path, not a full fixed URL (PRD C-08)."
    also_expected: []
    assertable: false   # CK-12 scope is decided (issue #232, point 6); the shared extractor (FR-C-01) is not implemented, so the finding is not asserted yet
    notes: "v1 scope decided by the guide (issue #232, point 6; checker design section 12 item 19): embedded Markdown images and HTML img/video/audio/source/track references in activity bodies; data: URIs are not flagged; @@PLUGINFILE@@ references pass; ordinary links (including PDFs) and iframe embeds are not in scope and not checked in v1. Extraction, as confirmed by Akshita as the affected M1 owner (issue #232): every in-scope reference is listed in media_refs as written, including relative paths, @@PLUGINFILE@@ references and data: URIs; the guide's text does not state this listing in so many words. CK-12 flags only the decided full fixed URL forms (http://, https:// and protocol-relative //host/), so relative paths, @@PLUGINFILE@@ references and data: URIs are listed and not flagged; other URI schemes are an open decision. The shared test vectors are in contracts/test-vectors/media-refs.v1.json; the builder's media_refs extraction is not built and Akshita's formal approval of the B2 contract change is given on the pull request, so nothing is verified end to end. This variant plants the URL in the source file only, so its expected finding is not asserted yet."

  - id: ck-13-unlock-without-completion
    rule: CK-13
    input_kind: mbz
    status: pending-lab
    path: null
    element: wk-01-task
    planted_change: "Week 1 task, which unlocks week 2, has completion tracking off"
    expected: {rule: CK-13, element: wk-01-task, severity: error}
    reason: "An unlock rule depends on an activity that never records completion."
    also_expected: []
    notes: "Week 2 is still listed as unreachable, with its cause, but is not a separate CK-01 finding: the report line says explained by CK-13 (guide, item 13). A package cannot express it."

# The four #118 variants (missing-body, duplicate-id, protected-id, invalid-mode) test the B1
# validator, not CK rules, and are recorded in #118's answer.yaml. They are not repeated here.
