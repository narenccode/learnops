# B8.3 expected findings (PRD B8.3, C2.3, C2.7). One entry per planted error.
# Source of the mapping: docs/design/checker.md section 11.3 (Proposal, #148). Not yet confirmed by the guide.
# These entries say what a future checker SHOULD report. No checker exists yet, so nothing here
# proves detection. Every variant is a copy of B8.2 with ONE change; B8.2 itself is never changed.
#
# Fields
#   id              unique variant id (package variants: also the folder name)
#   rule            CK rule from PRD C2.3 (CK-01..CK-13)
#   input_kind      package (folder `<id>/package/`) or mbz (Moodle backup, built in a lab)
#   status          built (files exist in this folder) | planned (package variant, added in a later PR of
#                   the B8.3 series) | pending-lab (needs a Moodle lab session; no file yet)
#   path            package variants: the changed file, relative to the package folder
#   element         the course element carrying the error, by idnumber
#   planted_change  the one change made to a B8.2 copy
#   expected        the finding a checker must report: rule, element, severity
#   reason          why it must be reported
#   also_expected   other rules that may fire on the same variant (interactions), or []
#   notes           open points
#   assertable      optional; false = the expected finding is provisional and must not be asserted by a checker test yet

version: 1
# PROVISIONAL. This mapping comes from docs/design/checker.md section 11.3, which is itself a
# Proposal. It is NOT an approved expected-results baseline and must not be used as the oracle
# for the 100 % target (PRD C2.7) until `confirmation` below is filled in by Akshita and the guide.
# When confirmed, set mapping_status to confirmed and record who confirmed it, where and when.
mapping_status: provisional
confirmation: null   # {by: [...], reference: <issue/PR/decision link>, date: <YYYY-MM-DD>}
baseline: testdata/b8-2-sample-course   # must report zero findings
variants:

  - id: ck-01-unreachable-by-past-date
    rule: CK-01
    input_kind: mbz
    status: pending-lab
    path: null
    element: wk-03-guide
    planted_change: "Week 3 guide Page availability: opens only before 1 January 2020 (restricted access, date condition)"
    expected: {rule: CK-01, element: wk-03-guide, severity: error}
    reason: "The date condition is already in the past, so no learner can ever open the Page."
    also_expected: []
    notes: "A package can only express unlock.start_date, which opens a section and never closes it, so this needs an .mbz."

  - id: ck-02-completion-never-met
    rule: CK-02
    input_kind: package
    status: built
    path: course.yaml
    element: wk-01-guide
    planted_change: "wk-01-guide (a Page) gets `completion: submit`"
    expected: {rule: CK-02, element: wk-01-guide, severity: error}
    reason: "A Page has nothing to submit, so the completion rule can never be met."
    also_expected: []
    notes: "Nothing unlocks from the Page (week 2 waits for wk-01-task), so CK-13 and CK-01 do not interact."

  - id: ck-03-points-total-mismatch
    rule: CK-03
    input_kind: package
    status: built
    path: course.yaml
    element: course.total_points
    planted_change: "course.total_points changed from 100 to 120; the four tasks still add up to 100"
    expected: {rule: CK-03, element: course.total_points, severity: error}
    reason: "Graded points (100) differ from the declared target (120)."
    also_expected: []
    notes: "The target is changed, not a task's points, so CK-09 does not fire."

  - id: ck-04-unlock-missing-activity
    rule: CK-04
    input_kind: mbz
    status: pending-lab
    path: null
    element: wk-03
    planted_change: "Week 3 availability names an activity (cm) that was removed from the course"
    expected: {rule: CK-04, element: wk-03, severity: error}
    reason: "The unlock rule refers to an activity that does not exist."
    also_expected: [CK-01]
    notes: "Week 3 also becomes unreachable. Whether CK-01 is reported or suppressed is open (checker design section 12 item 13). In a package the B1 validator rejects an unknown unlock.after."

  - id: ck-05-circular-unlock
    rule: CK-05
    input_kind: mbz
    status: pending-lab
    path: null
    element: "wk-02, wk-03"
    planted_change: "Week 2 section waits for wk-03-task and week 3 section waits for wk-02-task"
    expected: {rule: CK-05, element: "wk-02, wk-03", severity: error}
    reason: "Each section waits for the other, so neither can ever open."
    also_expected: [CK-01]
    notes: "CK-01 on both sections unless suppressed (section 12 item 13). A package rejects a later reference (decision 0003 #23)."

  - id: ck-06-duplicate-idnumber
    rule: CK-06
    input_kind: mbz
    status: pending-lab
    path: null
    element: wk-01-task
    planted_change: "Two activities carry the ID number wk-01-task"
    expected: {rule: CK-06, element: wk-01-task, severity: error}
    reason: "idnumbers identify activities and must be unique."
    also_expected: []
    notes: "The package variant duplicate-id (#118) is a B1 error (duplicate_idnumber), not CK-06."

  - id: ck-06-invalid-idnumber
    rule: CK-06
    input_kind: mbz
    status: pending-lab
    path: null
    element: "Week 1 Task"
    planted_change: "One activity has the ID number `Week 1 Task` (spaces and capitals)"
    expected: {rule: CK-06, element: "Week 1 Task", severity: error}
    reason: "The idnumber is not in the valid form."
    also_expected: []
    notes: "Separate variant from the duplicate so each has one change."

  - id: ck-07-protected-item-changed
    rule: CK-07
    input_kind: mbz
    status: pending-lab
    path: null
    element: final-project
    planted_change: "After merging into the B8.1 template, the Final project max grade is 80 instead of 100"
    expected: {rule: CK-07, element: final-project, severity: error}
    reason: "A protected item must stay as in the reference model (B8.1)."
    also_expected: []
    notes: "Needs --reference-model (the B8.1 model). A package using `final-project` is a B1 error, not CK-07."

  - id: ck-08-completion-criteria-missing-item
    rule: CK-08
    input_kind: mbz
    status: pending-lab
    path: null
    element: course-completion-criteria
    planted_change: "Course completion criteria name an activity that was deleted from the course"
    expected: {rule: CK-08, element: course-completion-criteria, severity: error}
    reason: "The criteria refer to an item that no longer exists."
    also_expected: []
    notes: "Badge criteria could be a second variant; not planted yet."

  - id: ck-09-marking-table-sum
    rule: CK-09
    input_kind: package
    status: built
    path: weeks/02-task.md
    element: wk-02-task
    planted_change: "Marking table row 'Document answers' changed from 10 to 5, so rows add up to 20; the task is worth 25"
    expected: {rule: CK-09, element: wk-02-task, severity: error}
    reason: "Marking-table points (20) differ from the assignment points (25)."
    also_expected: []
    notes: "The B1 validator lists the marking table as not checked, so only CK-09 fires."

  - id: ck-10-no-marking-workflow
    rule: CK-10
    input_kind: mbz
    status: pending-lab
    path: null
    element: wk-01-task
    planted_change: "Week 1 task assignment: marking workflow turned off"
    expected: {rule: CK-10, element: wk-01-task, severity: error}
    reason: "Assignments must use a marking workflow so grades are not released automatically."
    also_expected: []
    notes: ""

  - id: ck-11-graded-practice-h5p
    rule: CK-11
    input_kind: mbz
    status: pending-lab
    path: null
    element: "practice item in week 1"
    planted_change: "A week 1 practice H5P activity with a grade of 10"
    expected: {rule: CK-11, element: "practice item in week 1", severity: error}
    reason: "Practice activities must not carry a grade item."
    also_expected: []
    notes: "In a package, graded: true on an h5p item is a B1 schema error, not CK-11."

  - id: ck-12-full-url-media
    rule: CK-12
    input_kind: package
    status: planned
    path: weeks/01-guide.md
    element: wk-01-guide
    planted_change: "Guide body gets an image at https://example.invalid/diagram.png (example.invalid never resolves)"
    expected: {rule: CK-12, element: wk-01-guide, severity: error}
    reason: "Media must be a relative path, not a full fixed URL (PRD C-08)."
    also_expected: []
    assertable: false   # PROVISIONAL: not asserted until checker design section 12 item 19 is decided
    notes: "CK-12 reads media_refs of the B2 model (design section 3.4). Whether the model builder extracts media from a page body into media_refs is open (section 12 item 19). Until it is agreed and tested end to end, this variant only plants the URL in the source file; its expected finding is not asserted."

  - id: ck-13-unlock-without-completion
    rule: CK-13
    input_kind: mbz
    status: pending-lab
    path: null
    element: wk-01-task
    planted_change: "Week 1 task, which unlocks week 2, has completion tracking off"
    expected: {rule: CK-13, element: wk-01-task, severity: error}
    reason: "An unlock rule depends on an activity that never records completion."
    also_expected: [CK-01]
    notes: "Week 2 becomes unreachable; CK-01 unless suppressed (section 12 item 13). A package cannot express it."

# The four #118 variants (missing-body, duplicate-id, protected-id, invalid-mode) test the B1
# validator, not CK rules, and are recorded in #118's answer.yaml. They are not repeated here.
