# Expected results for the four D2 B8.3 planted-error packages.
# Observed through checker check <package> --json.
# Rule values are B1 validator references, not CK catalogue IDs.

cases:
  - id: missing-body
    package: missing-body/package
    expected_ok: false
    expected_error_count: 1
    errors:
      - code: body_file_missing
        rule: "B1.1"
        location: [sections, 1, activities, 1, body]
        idnumber: wk-02-task
        message: "sections[1].activities[1].body: the file 'weeks/02-task.md' does not exist in the package."

  - id: duplicate-id
    package: duplicate-id/package
    expected_ok: false
    expected_error_count: 1
    errors:
      - code: duplicate_idnumber
        rule: "B1.2 rule 6"
        location: [sections, 1, activities, 1, idnumber]
        idnumber: wk-01-task
        message: "sections[1].activities[1].idnumber: the idnumber 'wk-01-task' is already used at sections[0].activities[1].idnumber. Idnumbers must be unique in the course."

  - id: protected-id
    package: protected-id/package
    expected_ok: false
    expected_error_count: 1
    errors:
      - code: schema_not
        rule: "B1.1"
        location: [sections, 3, activities, 1, idnumber]
        idnumber: null
        message: "sections[3].activities[1].idnumber: 'final-project' is a protected idnumber and cannot be used in a package."

  - id: invalid-mode
    package: invalid-mode/package
    expected_ok: false
    expected_error_count: 1
    errors:
      - code: schema_enum
        rule: "B1.1"
        location: [course, mode]
        idnumber: null
        message: "course.mode: 'everything' is not one of ['full', 'sections-only']"
