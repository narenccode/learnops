# 33 fictional submissions written against the marking tables of the four tasks of the merged B8.2
# sample course (testdata/b8-2-sample-course), in the submission form of PRD B1.5: online text with
# Repository:, Demo: and Report: lines, and a report file only when the online text has no Report:
# section. They are the author's own work (Student 3), so they all belong to the development split
# (design Q47); the sealed test split is still to be written by someone else.
