# guide decides whether it counts as complete. Akshita approved the format under PRD B.0 rule 3
# (issue #186, comment 7096886192, 23 Nov 2026; O7). s028 (online text as editor
# HTML) is left out: B1.5 rule 5 is unverified until the lab check. Its id is not reused.
#
# All content is fictional and written for this project. No real learner data.
