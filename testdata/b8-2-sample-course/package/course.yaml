# B8.2 sample course: a fictional four-week project-based course (PRD B8.2, following B1).
# Fictional test data only. No real learner data, no real course content (PRD C-07).
# It holds the four weekly sections only. The protected items (final project, course feedback,
# completion criteria, badge) belong to the B8.1 template and are never written here (PRD B1.4).
schema: learnops.course/v1
course:
  shortname: SAMPLE-DOC-101
  fullname: "Build a Document Question Assistant"
  slug: build-document-assistant
  total_points: 100
  mode: full
sections:
