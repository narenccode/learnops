    title: "Week 1 — Publish a starter assistant"
    idnumber: wk-01
    unlock:
      after: null
    activities:
      - type: page
        idnumber: wk-01-guide
        title: "Week 1 guide"
        body: weeks/01-guide.md
      - type: assignment
        idnumber: wk-01-task
        title: "Week 1 task"
        body: weeks/01-task.md
        points: 25
        submission: [onlinetext, file]
        completion: submit
  - number: 2
    title: "Week 2 — Answer from a document"
