[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnops-checker"
version = "0.1.0"
description = "LearnOps course package checker"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[project.scripts]
checker = "checker.cli:main"

[tool.setuptools]
packages = ["checker", "contracts"]

[tool.setuptools.package-dir]
checker = "modules/checker"
contracts = "libs/contracts"
